<!DOCTYPE html>
<html>
<head>
<title>Hotel Room Booking Form</title>
</head>
<body>
<h1 align="center">Hotel Room Booking Form</h1>
<form action="#" method="post" align="center">
<!-- Name -->
<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" placeholder="e.g. Your Name" required>
<br><br>
<!-- Email -->
<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="your email address goes here"
required>
<br><br>
<!-- Phone Number -->
<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" placeholder="10 digit mobile number" required>
<br><br>
<!-- Check-in Date -->
<label for="checkin">Check-in Date:</label>
<input type="date" id="checkin" name="checkin" required>
<br><br>
<!-- Check-out Date -->
 <label for="checkout">Check-out Date:</label>
<input type="date" id="checkout" name="checkout" required>
<br><br>
<!-- Room Type -->
<label for="roomtype">Room Type:</label>
<select id="roomtype" name="roomtype" required>
 <option value="">Select a room type</option>
 <option value="single">Single Room</option>
 <option value="double">Double Room</option>
 <option value="suite">Suite</option>
</select>
<br><br>
<!-- Number of Guests -->
<label for="guests">Number of Guests:</label>
<input type="number" id="guests" name="guests" min="1" max="10" placeholder="e.g. 2"
required>
<br><br>
<!-- Special Requests -->
<label for="requests">Special Requests:</label>
<textarea id="requests" name="requests" rows="4" cols="50"></textarea>
<br><br>
<!-- Submit Button -->
<input type="submit" value="Book Now">
<input type="reset" value="Reset form">
</form>
</body>
</html>
